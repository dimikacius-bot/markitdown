name: Publier le repertoire horloger

on:
  push:
    branches: [claude/site-montres-sans-photo-1z52gu]
    paths: ['repertoire-horloger/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true active GitHub Pages sans passer par les reglages du depot
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repertoire-horloger
      - id: deployment
        uses: actions/deploy-pages@v4
